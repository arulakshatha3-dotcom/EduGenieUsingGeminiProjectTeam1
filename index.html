<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🎓 EduGenie</h1>
            <p>Google Gemini Powered Learning Assistant</p>
        </header>

        <main>

            <div class="card">

                <label for="task">Choose a Learning Task</label>

                <select id="task">
                    <option value="qa">Question & Answer</option>
                    <option value="explain">Explain a Concept</option>
                    <option value="quiz">Generate Quiz</option>
                    <option value="summarize">Summarize Text</option>
                    <option value="learn">Learning Path</option>
                </select>

                <div id="level-container" style="display: none;">
                    <label for="level">Learning Level</label>

                    <select id="level">
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>

                <label for="inputText">Enter your topic or question</label>

                <textarea
                    id="inputText"
                    rows="8"
                    placeholder="Type your question or topic here..."
                ></textarea>

                <button id="submitBtn">
                    ✨ Generate
                </button>

            </div>

            <div class="card result-card">

                <h2>Result</h2>

                <div id="loading" style="display: none;">
                    Generating response...
                </div>

                <div id="result">
                    Your AI-generated answer will appear here.
                </div>

            </div>

        </main>

    </div>

    <script src="/static/app.js"></script>

</body>
</html>
